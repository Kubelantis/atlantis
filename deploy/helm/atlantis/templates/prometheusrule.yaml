{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "atlantis.fullname" . }}
  labels:
    {{- include "atlantis.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}{{ toYaml . | nindent 4 }}{{ end }}
spec:
  groups:
    - name: atlantis
      rules:
        - alert: AtlantisNoLeader
          expr: max(atlantis_cluster_leader{namespace="{{ .Release.Namespace }}"}) < 1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: No Atlantis replica holds the leader Lease; stale Leases are not being cleaned up.
        # Each replica scraped through this release's Service reports how many
        # live members it sees. Compare that with the number of reporting
        # replicas (the series count), which works at any HPA size, and with
        # the configured floor, which catches replicas that are down: the
        # HPA's minReplicas, or replicaCount without HPA (the StatefulSet
        # ignores replicaCount when HPA manages it).
        - alert: AtlantisMembershipDegraded
          {{- $members := printf "atlantis_cluster_members{namespace=%q, service=%q}" .Release.Namespace (include "atlantis.fullname" .) }}
          expr: |
            min({{ $members }}) < count({{ $members }})
            or
            min({{ $members }}) < {{ if .Values.autoscaling.enabled }}{{ .Values.autoscaling.minReplicas }}{{ else }}{{ .Values.replicaCount }}{{ end }}
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: An Atlantis replica sees fewer live members than there are reporting replicas, or fewer than the configured minimum.
        - alert: AtlantisDuplicateIdentity
          expr: max(atlantis_cluster_identity_conflict{namespace="{{ .Release.Namespace }}"}) > 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: Two Atlantis processes are running with the same replica identity; one stays not ready. Check for a force-deleted pod still running or a shared --kubernetes-identity.
        - alert: AtlantisForwardingErrors
          expr: sum(rate(atlantis_cluster_routing_forward_error{namespace="{{ .Release.Namespace }}"}[10m])) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Atlantis replicas cannot reach pull owners; commands are running on the receiving replica.
        - alert: AtlantisPlanRiskErrors
          expr: sum(rate(atlantis_plan_risk_error{namespace="{{ .Release.Namespace }}"}[30m])) > 0
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: Plan risk assessments are failing and falling back to the failure tier.
{{- end }}
