# -- Number of Atlantis replicas. Each pull request is handled by one replica;
# webhooks that reach another replica are forwarded to it.
replicaCount: 2

# -- This fork's image. Upstream Atlantis images lack its Kubernetes-native
# code. The tag defaults to "v" + the chart's appVersion, the tag a release
# publishes; until that release exists, set a published tag such as "dev"
# (built from master) or "dev-<commit>".
image:
  repository: ghcr.io/kubelantis/katlantis
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# -- Public URL of Atlantis, used in links posted to pull requests.
atlantisUrl: "https://atlantis.example.com"

# -- Repos Atlantis may run on (--repo-allowlist).
repoAllowlist: "github.com/example-org/*"

# -- Name of an existing Secret whose keys are exposed as environment
# variables, e.g. ATLANTIS_GH_USER, ATLANTIS_GH_TOKEN, ATLANTIS_GH_WEBHOOK_SECRET,
# ATLANTIS_TYPESAFE_API_KEY. Required.
vcsSecretName: ""

# -- Extra `atlantis server` flags as ATLANTIS_* environment variables.
extraEnv: []
#  - name: ATLANTIS_ENABLE_POLICY_CHECKS
#    value: "true"

cluster:
  # -- Port of the internal listener used between replicas. Never exposed.
  port: 4142
  # -- How long an apply waits for a restarting replica that holds its plan.
  planHolderWaitSeconds: 180
  # -- Existing Secret holding the inter-replica token under key `token`.
  # When empty the chart creates one and keeps it across upgrades.
  tokenSecretName: ""

# -- Server-side repo config (repos.yaml). The metrics block enables the
# Prometheus endpoint; keep it if you replace this value.
repoConfig: |
  repos:
    - id: /.*/
  metrics:
    prometheus:
      endpoint: /metrics

# -- Object storage (S3 or S3-compatible) shared by all replicas. Credentials
# come from the default AWS chain: use workload identity (e.g. IRSA via
# serviceAccount.annotations) rather than static keys.
externalStores:
  # -- Plans in object storage: any replica can apply, and plans survive
  # losing a replica or its volume. Applies then no longer wait for the
  # replica that made the plan.
  planStore:
    enabled: false
    bucket: ""
    region: ""
    prefix: atlantis/plans
    endpoint: ""
    forcePathStyle: false
    # -- AES256, aws:kms or aws:kms:dsse. Plans can contain secrets.
    serverSideEncryption: AES256
    kmsKeyId: ""
  # -- Completed job logs archived to object storage: any replica serves
  # them and they survive losing a replica.
  logStore:
    enabled: false
    bucket: ""
    region: ""
    prefix: atlantis/job-logs
    endpoint: ""
    forcePathStyle: false
    serverSideEncryption: AES256
    kmsKeyId: ""

planRisk:
  # -- Score every plan with TypeSafe Jev. Needs ATLANTIS_TYPESAFE_API_KEY in vcsSecretName.
  enabled: false
  # -- Highest tier that can be applied without pull request approval.
  maxUnapprovedTier: low
  # -- Tier used when a plan cannot be assessed.
  failureTier: high
  # -- Pinned TypeSafe model.
  model: jev-1.13.0

tracing:
  # -- Export OpenTelemetry traces over OTLP/gRPC.
  enabled: false
  # -- OTLP endpoint, e.g. http://otel-collector.observability:4317
  endpoint: ""
  # -- OTEL_TRACES_SAMPLER / OTEL_TRACES_SAMPLER_ARG.
  sampler: parentbased_traceidratio
  samplerArg: "1.0"

logLevel: info

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: atlantis.example.com
  tls: []

metrics:
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor.
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    # -- Create alerting rules for leader election, membership and routing.
    enabled: false
    labels: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

autoscaling:
  # -- Scale on CPU. Atlantis work is bursty and I/O bound; prefer a fixed
  # replica count unless you have measured it.
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

networkPolicy:
  # -- Restrict the cluster port to Atlantis pods.
  enabled: true

# -- How long a terminating replica waits for running plans/applies. Pulls
# move to other replicas immediately; this only bounds in-flight work.
terminationGracePeriodSeconds: 3600

# -- Per-replica volume for clones and plan files. Applies are routed to the
# replica that made the plan, so with persistence its plans survive restarts,
# and reschedules that keep the volume. While that replica is away, applies of
# its plans wait up to --cluster-plan-holder-wait-seconds, then fail until it
# is back; the plans are not lost. Scaling a replica away deletes its volume
# and its plans, as does losing a node-local volume. With more than one
# replica, configure an S3 plan store (external_stores) so any replica can
# apply.
persistence:
  enabled: true
  size: 20Gi
  storageClass: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 4Gi

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
# -- Defaults spread replicas across nodes and zones.
topologySpreadConstraints: []

podSecurityContext:
  runAsUser: 100
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]
